<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title description">
<title id="title">How fast Brand Sniper decides on a listing</title>
<desc id="description">Brand Sniper decision, median listing: 1.2 ms; Brand Sniper decision, 99th percentile: 2.1 ms; Brand Sniper, 100 listings at once (p99): 73 ms; Shortest blink of an eye: 100 ms; Median human reaction time: 273 ms; Fastest Skinport listing to sell: 9.1 s; Median Skinport listing to sell: 2.6 h. Log scale from 0.1 ms to 10,000 s.</desc>
<text x="16.0" y="26.0" fill="#0b0b0b" font-size="16" font-weight="600" text-anchor="start">From the Skinport socket to the decision, against times people know</text>
<text x="16.0" y="48.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="start">Log scale: each gridline is ten times the one before</text>
<circle cx="630" cy="44" r="6" fill="#2a78d6"/>
<text x="642.0" y="48.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="start">Brand Sniper, measured</text>
<circle cx="790" cy="44" r="6" fill="#8a8984"/>
<text x="802.0" y="48.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="start">For scale</text>
<line x1="350.0" y1="72" x2="350.0" y2="316" stroke="#e4e3df"/>
<text x="350.0" y="336.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">0.1 ms</text>
