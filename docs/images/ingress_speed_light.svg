<text x="482.5" y="336.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">10 ms</text>
<line x1="548.8" y1="72" x2="548.8" y2="316" stroke="#e4e3df"/>
<text x="548.8" y="336.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">100 ms</text>
<line x1="615.0" y1="72" x2="615.0" y2="316" stroke="#e4e3df"/>
<text x="615.0" y="336.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">1 s</text>
<line x1="681.2" y1="72" x2="681.2" y2="316" stroke="#e4e3df"/>
<text x="681.2" y="336.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">10 s</text>
<line x1="747.5" y1="72" x2="747.5" y2="316" stroke="#e4e3df"/>
<text x="747.5" y="336.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">100 s</text>
<line x1="813.8" y1="72" x2="813.8" y2="316" stroke="#e4e3df"/>
<text x="813.8" y="336.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">1,000 s</text>
<line x1="880.0" y1="72" x2="880.0" y2="316" stroke="#e4e3df"/>
<text x="880.0" y="336.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="middle">10,000 s</text>
<text x="16.0" y="99.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Brand Sniper decision, median listing</text>
<text x="330.0" y="99.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="end">1.2 ms</text>
