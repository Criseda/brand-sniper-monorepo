x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # EDGE CACHE LAYER: Volatile Sliding-Window Memory
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: sniper_edge_redis
    env_file:
      - ../../.env
    # CRITICAL PI 5 OPTIMIZATION: Disables both RDB snapshots and AOF logs.
    # Data stays entirely in RAM, preventing flash/SD-card wear and maximizing IOPS.
    command: ["sh", "-c", "redis-server --save '' --appendonly no --requirepass $$REDIS_PASSWORD"]
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - sniper_edge_network
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # APPLICATION LAYER: Edge Telemetry Daemon & Ingestion Stream
  # Set COMPUTE_NODE_IP in your .env or environment to point to the central
  # backend server (e.g. your Windows machine IP or cloud hostname).
  # ---------------------------------------------------------------------------
  listener:
    build:
      context: ../../
      dockerfile: apps/listener/Dockerfile
    container_name: sniper_listener
    env_file:
      - ../../.env
      - ../../apps/listener/.env
    environment:
      - EDGE_REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - sniper_edge_network
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  sniper_edge_network:
    driver: bridge
