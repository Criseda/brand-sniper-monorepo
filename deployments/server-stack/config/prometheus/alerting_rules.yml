groups:
  - name: sniper_service_status
    interval: 15s
    rules:
      - alert: BackendDown
        expr: up{job="sniper-backend"} == 0
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "Backend API is unreachable", description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}" }

      - alert: ListenerDown
        expr: up{job="sniper-listener"} == 0
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "The {{ $labels.listener }} listener is down", description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}" }

      - alert: RedisExporterDown
        expr: up{job="sniper-redis"} == 0
        for: 30s
        labels: { severity: warning }
        annotations: { summary: "Redis exporter is unreachable" }

      - alert: PostgresExporterDown
        expr: up{job="sniper-postgres"} == 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Postgres exporter is unreachable" }

      - alert: DatabaseUnreachable
        expr: pg_up == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "The exporter cannot connect to PostgreSQL", description: "Check DATABASE_URL (or POSTGRES_EXPORTER_DSN) and the database host's firewall" }

  # The storage limit is set by hand in database_storage.yml.
  - name: sniper_database
    interval: 60s
    rules:
      - alert: DatabaseStorageHigh
        expr: sniper:database_storage_used_bytes / scalar(sniper:database_storage_limit_bytes) > 0.8
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Database storage above 80% of the plan limit", description: "{{ $value | humanizePercentage }} used. Free space or move to a bigger plan, then update database_storage.yml" }

      - alert: DatabaseStorageCritical
        expr: sniper:database_storage_used_bytes / scalar(sniper:database_storage_limit_bytes) > 0.9
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "Database storage above 90% of the plan limit", description: "{{ $value | humanizePercentage }} used. A hosted database usually turns read-only when it fills up" }

      - alert: DatabaseStorageFullWithinAWeek
        expr: predict_linear(sniper:database_storage_used_bytes[12h], 7 * 86400) > scalar(sniper:database_storage_limit_bytes)
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Database storage will reach the plan limit within 7 days at the current growth rate" }

      - alert: DatabaseConnectionsHigh
        expr: sum(pg_stat_database_numbackends) / scalar(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Database connections above 80% of max_connections", description: "{{ $value | humanizePercentage }} of max_connections in use" }

  - name: sniper_performance
    interval: 30s
    rules:
      - alert: HighDRELantency
        expr: histogram_quantile(0.95, sum(rate(listener_rules_engine_latency_seconds_bucket[5m])) by (le, listener)) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "DRE p95 latency above 500ms on the {{ $labels.listener }} listener", description: "DRE evaluation latency is degrading performance" }

      - alert: HighRedisLatency
        expr: rate(listener_redis_operation_latency_seconds_sum[5m]) / rate(listener_redis_operation_latency_seconds_count[5m]) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Redis operation latency above 50ms" }

  - name: sniper_anomalies
    interval: 30s
    rules:
      - alert: AnomalyRateSpike
        expr: sum by (listener, source) (rate(listener_anomalies_detected_total[5m])) * 60 > 50
        for: 2m
        labels: { severity: info }
        annotations: { summary: "High anomaly detection rate", description: "More than 50 anomalies/min — possible market event or misconfiguration" }

      # A health check, not a measure of edge: the DRE rejects every flag it has no baseline for, so
      # almost no approvals over a busy hour usually means the edge baselines did not load. Rejections by the
      # fee floor (#331) need a baseline price, so they do not count.
      - alert: DRERejectsAlmostEverything
        expr: |
          sum by (listener) (increase(listener_anomalies_confirmed_total[1h]))
            / (sum by (listener) (increase(listener_anomalies_confirmed_total[1h])) + sum by (listener) (increase(listener_anomalies_rejected_total{reason!="below_fee_floor"}[1h]))) < 0.1
          and (sum by (listener) (increase(listener_anomalies_confirmed_total[1h])) + sum by (listener) (increase(listener_anomalies_rejected_total{reason!="below_fee_floor"}[1h]))) >= 20
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "DRE approved under 10% of at least 20 flags in the last hour on the {{ $labels.listener }} listener", description: "Check that the edge baselines loaded (listener_baselines_loaded) before touching thresholds" }

  - name: sniper_backend_errors
    interval: 30s
    rules:
      - alert: HighBatchFlushErrorRate
        expr: sum by (listener) (rate(listener_batch_flush_total{status=~"retry|dead_letter"}[5m])) > 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Batch flush errors detected", description: "The listener is failing to flush batches to the backend" }

      - alert: BatchDeliveryDeadLetters
        expr: increase(listener_batch_delivery_dead_letters_total[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Batches moved to dead-letter storage", description: "Replay with replay_batches.py --venue {{ $labels.listener }}, or inspect that listener's Redis dead-letter stream" }

      - alert: BatchDeliveryMalformedRecords
        expr: increase(listener_batch_delivery_malformed_total[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Malformed batches moved to quarantine", description: "Inspect the listener Redis malformed stream before replaying data" }

      - alert: ListenerBackgroundJobFailures
        expr: sum by (listener) (rate(listener_background_jobs_total{outcome="failed"}[5m])) > 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Listener background jobs are failing", description: "Anomaly evaluation or batch-flush jobs are failing" }

      - alert: TradeSubmissionFailures
        expr: sum by (listener) (rate(listener_trade_submissions_total{outcome=~"error|rejected"}[5m])) > 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Paper-trade submissions are failing", description: "The listener cannot reliably submit paper trades to the backend" }

      - alert: BackendRequestFailures
        expr: sum(rate(backend_http_errors_total{status_code=~"5.."}[5m])) > 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Backend API is returning server errors", description: "Inspect backend_http_errors_total by route and status code" }
