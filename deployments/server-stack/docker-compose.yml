x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Optional local PostgreSQL is defined in docker-compose.override.example.yml.
  # ---------------------------------------------------------------------------
  # EDGE CACHE LAYER: Volatile Sliding-Window Memory
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.10.0-alpine
    container_name: sniper_edge_redis
    env_file:
      - ../../.env
    command: ["sh", "-c", "redis-server --save '' --appendonly no --requirepass $$REDIS_PASSWORD"]
    networks:
      - data
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # ORCHESTRATION LAYER: Prefect 3.0 Core Workflow Server
  # ---------------------------------------------------------------------------
  prefect-server:
    image: prefecthq/prefect:3.8.2.dev1-python3.12
    container_name: sniper_prefect_server
    command: prefect server start --host 0.0.0.0
    environment:
      - PREFECT_API_URL=http://localhost:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - application
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ---------------------------------------------------------------------------
  # MLOPS LAYER: MLflow Metric Tracking & Model Registry
  # ---------------------------------------------------------------------------
  mlflow-server:
    build:
      context: ../../
      dockerfile: deployments/server-stack/mlflow.Dockerfile
    container_name: sniper_mlflow_server
    env_file:
      - ../../.env
    environment:
      PYTHONWARNINGS: ignore:::mlflow.server.fastapi_app
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow-server:*,localhost:*
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_WORKERS: "1"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlruns
    networks:
      - application
      - data
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # OBSERVABILITY LAYER: Metrics and Dashboards
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: sniper_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - observability
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  grafana:
    image: grafana/grafana:13.1.4
    container_name: sniper_grafana
    env_file:
      - ../../.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - observability
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.89.0-alpine
    container_name: sniper_redis_exporter
    env_file:
      - ../../.env
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - data
      - observability
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # APPLICATION LAYER: Core Compute Engine REST API & FastMCP Agent Server
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile
    container_name: sniper_backend
    env_file:
      - ../../.env
      - ../../apps/backend/.env
    environment:
      - COMPUTE_NODE_IP=backend
      - REDIS_URL=redis://redis:6379
    ports:
      - "8080:8080"
    networks:
      - application
      - data
      - observability
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ---------------------------------------------------------------------------
  # APPLICATION LAYER: Edge Telemetry Daemon & Ingestion Stream
  # ---------------------------------------------------------------------------
  listener:
    build:
      context: ../../
      dockerfile: apps/listener/Dockerfile
    container_name: sniper_listener
    env_file:
      - ../../.env
      - ../../apps/listener/.env
    environment:
      - COMPUTE_NODE_IP=backend
      - EDGE_REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - application
      - data
      - observability
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # APPLICATION LAYER: Macro Analytics & Adversarial CFO Pipeline  (one-shot batch job)
  # Run manually: docker compose run analytics
  # ---------------------------------------------------------------------------
  analytics:
    build:
      context: ../../
      dockerfile: apps/analytics/Dockerfile
    container_name: sniper_analytics
    profiles:
      - manual
    env_file:
      - ../../.env
      - ../../apps/analytics/.env
    environment:
      - COMPUTE_NODE_URL=http://backend:8080
      - EDGE_REDIS_URL=redis://redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - PREFECT_API_URL=http://prefect-server:4200/api
    networks:
      - application
      - data
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      mlflow-server:
        condition: service_healthy
      prefect-server:
        condition: service_healthy


# ---------------------------------------------------------------------------
# PERSISTENT STORAGE BOUNDARIES
# ---------------------------------------------------------------------------
volumes:
  prefect_data:
  mlflow_data:
  prometheus_data:
  grafana_data:

networks:
  data:
    driver: bridge
    internal: true
  application:
    driver: bridge
  observability:
    driver: bridge
