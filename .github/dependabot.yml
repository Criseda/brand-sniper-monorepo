version: 2
# One grouped PR per ecosystem: Python packages, GitHub Actions, and server-stack Docker images.
# Security updates get their own grouped PR per ecosystem so they are not held back by a weekly batch.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directory: "/deployments/server-stack"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker-images:
        applies-to: version-updates
        patterns: ["*"]
      docker-images-security:
        applies-to: security-updates
        patterns: ["*"]
