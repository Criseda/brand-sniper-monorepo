name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mypy.ini'
      - 'deployments/**'
      - 'scripts/check_compose_hardening.py'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  # A pull request that only touches docs skips quality and test. A skipped job
  # counts as passed for the required status checks, so the PR can still merge.
  # The workflow itself must still run on every PR: with a paths filter on
  # pull_request the required checks would never report and the PR would hang.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Docs: any Markdown file, anything under docs/, and LICENSE.
          code_files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -v -E '(\.md$|^docs/|^LICENSE$)' || true)
          if [ -n "$code_files" ]; then
            echo "Non-docs files changed:"
            echo "$code_files"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change, skipping quality and test."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Validate Docker Compose hardening
        run: |
          cp .env.example .env
          cp apps/backend/.env.example apps/backend/.env
          cp apps/listener/.env.example apps/listener/.env
          cp apps/analytics/.env.example apps/analytics/.env
          uv run python scripts/check_compose_hardening.py

      - name: Audit dependencies
        run: uv audit

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy apps/backend/ apps/listener/ apps/analytics/

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Run tests
        run: uv run coverage run -m pytest

      - name: Coverage report (gate)
        run: |
          uv run coverage report
          uv run coverage xml -o coverage.xml

      - name: Per-module coverage targets
        run: uv run python scripts/check_coverage_targets.py

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
