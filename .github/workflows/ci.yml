name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mypy.ini'
      - 'deployments/**'
      - 'scripts/check_compose_hardening.py'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Validate Docker Compose hardening
        run: |
          cp .env.example .env
          cp apps/backend/.env.example apps/backend/.env
          cp apps/listener/.env.example apps/listener/.env
          cp apps/analytics/.env.example apps/analytics/.env
          uv run python scripts/check_compose_hardening.py

      - name: Audit dependencies
        run: uv audit

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy apps/backend/ apps/listener/ apps/analytics/

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Run tests
        run: uv run coverage run -m pytest

      - name: Coverage report (gate)
        run: |
          uv run coverage report
          uv run coverage xml -o coverage.xml

      - name: Per-module coverage targets
        run: uv run python scripts/check_coverage_targets.py

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
