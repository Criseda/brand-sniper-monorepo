[project]
name = "brand-sniper-monorepo"
version = "0.1.0"
description = "Algorithmic Market Sniping & Macro Arbitrage Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "gitpython>=3.1.57",
]

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*"
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "coverage>=7.15.2",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning:prefect.*",
    'ignore:.*httpx.*:UserWarning',
]
pythonpath = [
    "packages/shared_utils/src",
    "apps/analytics",
    "apps/listener",
]

[tool.ruff]
line-length = 128
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = [
    "apps/backend",
    "apps/listener",
    "apps/analytics",
    "packages/shared_utils/src",
]
omit = [
    "*/tests/*",
    "*/main.py",
    "deployments/migrations/*",
]

[tool.coverage.report]
fail_under = 45
show_missing = true


